<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button [text]="'core.back' | translate" />
        </ion-buttons>
        <ion-title>
            <h1>{{ 'core.settings.appsettings' | translate }}</h1>
        </ion-title>
        <ion-buttons slot="end" />
    </ion-toolbar>
</ion-header>
<ion-content>
    <core-split-view>
        <div class="md3-settings-container">
            <div class="md3-settings-group">
                <div class="md3-group-title">{{ 'core.settings.general' | translate }}</div>
                <div class="md3-group-card">
                    <ng-container *ngFor="let section of sections.items; let last = last">
                        <ion-item [attr.aria-current]="sections.getItemAriaCurrent(section)" button
                            [detail]="false" (click)="sections.select(section)" lines="none">
                            <ion-icon [name]="section.icon" slot="start" aria-hidden="true" class="md3-settings-icon" />
                            <ion-label class="ion-text-wrap">
                                <p class="item-heading">{{ section.name | translate }}</p>
                            </ion-label>
                        </ion-item>
                        <div *ngIf="!last" class="md3-card-divider"></div>
                    </ng-container>
                </div>
            </div>
        </div>
    </core-split-view>
</ion-content>
