@if (showLogoEffective() && logoLoaded()) {
    <div class="core-logo-container">
        @if (siteLogo()) {
            <img [url]="siteLogo()" class="core-logo light-logo"
                [alt]="'core.login.logoof' | translate: { $a: siteName() }" core-external-content
                [siteId]="siteId()" (onLoad)="imageLoaded($event)" [hidden]="logoError()">
            <img src="assets/img/busola_el_logo_dark.png" class="core-logo dark-logo"
                [alt]="'core.login.logoof' | translate: { $a: siteName() }" [hidden]="logoError()">
        }
        @if (!siteLogo() || logoError()) {
            <img [src]="fallbackLogo()" class="core-logo core-logo-fallback light-logo"
                [alt]="'core.login.logoof' | translate: { $a: appName() }">
            <img src="assets/img/busola_el_logo_dark.png" class="core-logo core-logo-fallback dark-logo"
                [alt]="'core.login.logoof' | translate: { $a: appName() }">
        }
    </div>
}

@if (showSiteName()) {
    @switch (siteNameMode()) {
        @case ('p') {
            <p class="ion-no-margin ion-no-padding core-logo-sitename">
                <core-format-text [text]="siteName()" contextLevel="system" [contextInstanceId]="0" [siteId]="siteId()" />
            </p>
        }
        @case ('') {
            <core-format-text [text]="siteName()" contextLevel="system" [contextInstanceId]="0" class="core-logo-sitename"
                [siteId]="siteId()" />
        }
        @case ('h2') {
            <h2 class="ion-margin-top ion-no-padding core-logo-sitename">
                <core-format-text [text]="siteName()" contextLevel="system" [contextInstanceId]="0" [siteId]="siteId()" />
            </h2>
        }
    }
}
